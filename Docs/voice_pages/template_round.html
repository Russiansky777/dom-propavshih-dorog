<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root {
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --ground: #150e09; --plank: #251810; --plank-edge: #3b2718; --ink: #f0e4cc; --muted: #b8a283; --gold: #e3bc74;
  --ok: #8fbf72; --redo: #d9705a; --field: #1c130c;
  --f-display: "Old Standard TT", "Times New Roman", serif;
  --f-body: "PT Serif", Georgia, "Times New Roman", serif;
}
[hidden] { display: none !important; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.wrap { max-width: 780px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 18px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 2.1rem; line-height: 1.15; margin: 0; color: var(--gold); text-wrap: balance; }
.lead { margin: 0; max-width: 64ch; }
.lead + .lead { color: var(--muted); font-size: .95rem; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; border-bottom: 1px solid var(--plank-edge); }
.bar .count { font-variant-numeric: tabular-nums; font-weight: 700; }
.bar .save { color: var(--muted); font-size: .9rem; min-width: 0; }
.bar .save.warn { color: var(--redo); }
.meter { flex: 1 1 160px; height: 6px; background: var(--plank); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s; }
.card { background: var(--plank); border: 1px solid var(--plank-edge); border-radius: 6px; padding: 16px 18px 18px; display: grid; gap: 10px; box-shadow: inset 0 0 0 1px rgba(227,188,116,.08); }
.card.ok { border-color: var(--ok); }
.card.redo { border-color: var(--redo); }
.head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.num { font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.who { font-weight: 700; }
.ctx { color: var(--muted); font-size: .85rem; min-width: 0; overflow-wrap: anywhere; }
.before { margin: 0; font-size: .92rem; color: var(--muted); }
.before b { color: var(--gold); font-weight: 400; letter-spacing: .02em; text-transform: uppercase; font-size: .72rem; margin-right: 6px; }
.line { margin: 0; font-style: italic; font-size: 1.08rem; }
.take { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 8px 10px; border-radius: 5px; background: var(--field); border: 1px solid transparent; }
.take.on { border-color: var(--gold); }
.take .tl { font-family: var(--f-display); font-weight: 700; color: var(--gold); font-size: 1.15rem; min-width: 1.2em; text-align: center; }
.take .tl small { display: block; font-family: var(--f-body); font-weight: 400; font-size: .66rem; color: var(--muted); line-height: 1.15; max-width: 9em; }
.take audio { width: 100%; height: 36px; min-width: 0; }
.take .warn { grid-column: 2 / 4; font-size: .85rem; color: var(--redo); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-size: .95rem; color: var(--ink); background: var(--field); border: 1px solid var(--plank-edge); border-radius: 5px; padding: 7px 14px; cursor: pointer; }
.take button { background: var(--plank); }
button:hover { border-color: var(--gold); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button[aria-pressed="true"].b-pick { background: var(--gold); color: var(--ground); border-color: var(--gold); }
button[aria-pressed="true"].b-redo { background: var(--redo); color: var(--ground); border-color: var(--redo); }
button[aria-pressed="true"].b-filter { border-color: var(--gold); color: var(--gold); }
textarea { font: inherit; font-size: .95rem; color: var(--ink); background: var(--field); border: 1px solid var(--plank-edge); border-radius: 5px; padding: 8px 10px; width: 100%; box-sizing: border-box; min-height: 2.6em; resize: vertical; }
.copy { margin-left: auto; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; margin: 18px 0 0; color: var(--gold); text-wrap: balance; }
.sect { margin: 0; color: var(--muted); max-width: 64ch; }
.solo audio { width: 100%; height: 36px; }
@media (max-width: 520px) { .take { grid-template-columns: auto minmax(0, 1fr); } .take button { grid-column: 1 / 3; justify-self: start; } .take .warn { grid-column: 1 / 3; } }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style></head><body>
<div class="wrap">
  <h1>{{TITLE_SHORT}}</h1>
  <p class="lead">{{LEAD}}</p>
  <p class="lead">Сверху — выбор: «Эта» у лучшей или «Ни одна» и что не так. Ниже — новые записи: «Хорошо» или «Переделать». Красным — слова, которые распознавание не услышало. Отметки сохраняются сами.</p>
  <div class="bar" role="status">
    <span class="count" id="count">Отмечено 0 из 0</span>
    <span class="meter" aria-hidden="true"><i id="meterfill"></i></span>
    <button type="button" class="b-filter" id="filter" aria-pressed="false">Только неотмеченные</button>
    <span class="save" id="save">Подключаю хранилище…</span>
    <button type="button" class="copy" id="copy" hidden>Скопировать отметки</button>
  </div>
  <div id="list" class="wrap" style="padding:0;gap:18px"></div>
</div>
<script>
const ROWS = {{ROWS}};
const marks = {};
let db = null, local = false, onlyOpen = false;
const queues = {};
const KEY = "voiceK13";
function load() { try { const s = localStorage.getItem(KEY); if (s) Object.assign(marks, JSON.parse(s)); } catch (e) {} }
function keepLocal() { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} }
function el(tag, attrs = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === "text") n.textContent = v; else if (k === "class") n.className = v; else n.setAttribute(k, v); }
  for (const c of kids) if (c) n.append(c);
  return n;
}
function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  let shown = 0, sect = false, first = true;
  for (const r of ROWS) {
    if (onlyOpen && (marks[r.id] || {}).pick) continue;
    if (first && r.kind === "pick") { first = false; list.append(el("h2", {text: "Выбрать запись"})); }
    if (r.kind === "check" && !sect) {
      sect = true;
      list.append(el("h2", {text: "Новые записи — по одной"}));
      list.append(el("p", {class: "sect", text: "Новые и изменённые тексты и строки, у которых записи не было. Хороша — «Хорошо»; нет — «Переделать» и что не так."}));
    }
    list.append(card(r));
    shown++;
  }
  if (!shown) list.append(el("p", {class: "empty", text: "Все строки отмечены. Спасибо!"}));
  progress();
}
function card(r) {
  const m = marks[r.id] || {};
  const c = el("article", {class: "card" + (m.pick === "none" ? " redo" : m.pick ? " ok" : ""), id: "c-" + r.id});
  c.append(el("div", {class: "head"}, [el("span", {class: "num", text: String(r.n).padStart(3, "0")}), el("span", {class: "who", text: r.who}), el("span", {class: "ctx", text: r.context})]));
  if (r.before) c.append(el("p", {class: "before"}, [el("b", {text: "Ваша заметка"}), document.createTextNode(r.before)]));
  c.append(el("p", {class: "line", text: "«" + r.subtitle + "»"}));
  if (r.kind === "check") {
    const t = r.takes[0];
    c.append(el("div", {class: "solo"}, [el("audio", {controls: "", preload: "none", src: t.file})]));
    if (t.miss && t.miss.length) c.append(el("p", {class: "before", style: "color:var(--redo)", text: "Не услышано: " + t.miss.join(", ")}));
    c.append(el("div", {class: "row"}, [
      btn("Хорошо", "b-pick", m.pick === "ok", () => setMark(r.id, {pick: m.pick === "ok" ? "" : "ok"})),
      btn("Переделать", "b-redo", m.pick === "none", () => setMark(r.id, {pick: m.pick === "none" ? "" : "none"}))]));
  } else {
    for (const t of r.takes) {
      const on = m.pick === t.take;
      const box = el("div", {class: "take" + (on ? " on" : "")}, [
        el("span", {class: "tl"}, [document.createTextNode(t.label), t.variant ? el("small", {text: t.variant}) : null]),
        el("audio", {controls: "", preload: "none", src: t.file}),
        btn(on ? "Выбрана" : "Эта", "b-pick", on, () => setMark(r.id, {pick: on ? "" : t.take}))]);
      if (t.miss && t.miss.length) box.append(el("p", {class: "warn", text: "Не услышано: " + t.miss.join(", ")}));
      c.append(box);
    }
    c.append(el("div", {class: "row"}, [btn("Ни одна", "b-redo", m.pick === "none", () => setMark(r.id, {pick: m.pick === "none" ? "" : "none"}))]));
  }
  const ta = el("textarea", {id: "note-" + r.id, rows: "2", placeholder: "Что не так (необязательно)"});
  ta.value = m.note || "";
  let timer = null;
  ta.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => setMark(r.id, {note: ta.value}, false), 900); });
  ta.addEventListener("blur", () => { clearTimeout(timer); if ((marks[r.id] || {}).note !== ta.value) setMark(r.id, {note: ta.value}, false); });
  c.append(ta);
  return c;
}
function btn(label, cls, on, fn) { const b = el("button", {type: "button", class: cls, "aria-pressed": on ? "true" : "false", text: label}); b.addEventListener("click", fn); return b; }
function setMark(id, patch, rerender = true) {
  const r = ROWS.find(x => x.id === id);
  marks[id] = Object.assign({pick: "", note: ""}, marks[id] || {}, patch, {line: r.line, at: new Date().toISOString()});
  keepLocal();
  if (rerender) { const old = document.getElementById("c-" + id); if (old) old.replaceWith(card(r)); }
  progress();
  write(id);
}
function write(id) {
  if (!db || local) return;
  const body = Object.assign({}, marks[id]);
  queues[id] = (queues[id] || Promise.resolve()).then(() => db.collection("marks").doc(id).set(body)).then(
    () => status("Сохранено " + new Date().toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"})),
    (e) => { local = true; status("Не сохраняется на странице (" + (e && e.code || "ошибка") + ") — отметки только в этом браузере, нажмите «Скопировать отметки»", true); document.getElementById("copy").hidden = false; });
}
function progress() {
  const n = ROWS.filter(r => (marks[r.id] || {}).pick).length;
  document.getElementById("count").textContent = "Отмечено " + n + " из " + ROWS.length;
  document.getElementById("meterfill").style.width = (ROWS.length ? 100 * n / ROWS.length : 0) + "%";
}
function status(t, warn = false) { const s = document.getElementById("save"); s.textContent = t; s.classList.toggle("warn", warn); }
document.getElementById("filter").addEventListener("click", (ev) => { onlyOpen = !onlyOpen; ev.currentTarget.setAttribute("aria-pressed", onlyOpen ? "true" : "false"); render(); });
document.getElementById("copy").addEventListener("click", async () => {
  const text = JSON.stringify({what: "{{TITLE}}, {{K}}", marks}, null, 1);
  try { await navigator.clipboard.writeText(text); status("Скопировано — вставьте в чат"); }
  catch (e) { const ta = el("textarea", {}); ta.value = text; document.querySelector(".wrap").append(ta); ta.select(); status("Выделено — скопируйте и вставьте в чат"); }
});
document.addEventListener("play", (ev) => { for (const a of document.querySelectorAll("audio")) if (a !== ev.target) a.pause(); }, true);
load();
render();
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { local = true; status("Хранилище недоступно — отметки только в этом браузере, в конце нажмите «Скопировать отметки»", true); document.getElementById("copy").hidden = false; return; }
  status("Отметки сохраняются");
  db.collection("marks").onSnapshot((snap) => {
    let changed = false;
    for (const d of snap.docs) {
      const v = d.data();
      if (!v) continue;
      const cur = marks[d.id] || {};
      if (!cur.at || (v.at && v.at > cur.at)) { marks[d.id] = Object.assign({}, v); changed = true; }
    }
    if (changed) { keepLocal(); render(); }
  }, (e) => { status("Связь с хранилищем прервана (" + (e && e.code || "") + ") — отметки только в этом браузере", true); document.getElementById("copy").hidden = false; local = true; });
})();
</script>
</body></html>
