name: motion-previews

# Превью движений для выбора Директором (22.10): Mesh2Motion / CMU / 100STYLE на модели Агаты + базовая линия Meshy.
# Живёт только в ветке motion-previews; в main не вливается. Один запуск = все ролики (matrix по клипу, параллельно).
# Результаты бот коммитит в эту же ветку: previews/<библиотека>/<id>.mp4, previews/manifest.json,
# previews/contact_*.jpg, previews/logs/, retargeted/<id>.npz.
# Запуск: изменить tools/motion_previews/** (или этот файл) и запушить в motion-previews.

on:
  push:
    branches: [motion-previews]
    paths:
      - "tools/motion_previews/**"
      - ".github/workflows/motion_previews.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-previews
  cancel-in-progress: false

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/motion_previews
          filter: blob:none
      - name: Клипы
        id: ids
        run: |
          python3 -c "import json;d=json.load(open('tools/motion_previews/clips.json'));r=json.load(open('tools/motion_previews/request.json'));ids=[c['id'] for c in d['clips'] if not r.get('only') or c['id'] in r['only']];print('ids='+json.dumps(ids))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Источники (Mesh2Motion — GitHub, CMU — зеркало BVH cgspeed на GitHub, 100STYLE — Zenodo)
        run: |
          set -euo pipefail
          python3 tools/motion_previews/fetch_sources.py --clips tools/motion_previews/clips.json --out _src 2>&1 | tee fetch.log
          find _src -type f -printf '%p %s\n'
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: _src
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-sources
          path: fetch.log
          retention-days: 3

  render:
    needs: sources
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.sources.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/motion_previews
            assets/characters/agata/rt3d
            game/assets/fonts/pt_serif
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/motion_previews/requirements.txt
      - name: Зависимости (bpy = Blender как модуль; ffmpeg — из pip imageio-ffmpeg, apt не нужен)
        timeout-minutes: 15
        run: |
          python -m pip install --timeout 60 --retries 5 -r tools/motion_previews/requirements.txt
          FF=$(python -c "import shutil,imageio_ffmpeg;print(shutil.which('ffmpeg') or imageio_ffmpeg.get_ffmpeg_exe())")
          "$FF" -hide_banner -version | head -1
          "$FF" -hide_banner -encoders 2>/dev/null | grep -q libx264 && echo "libx264: есть"
      - uses: actions/download-artifact@v4
        with:
          name: sources
          path: _src
      - name: Ретаргет, петля, чистка стоп, замеры
        run: |
          mkdir -p out/rt out/pv
          set +e
          python tools/motion_previews/retarget_clip.py --clip "${{ matrix.id }}" --clips tools/motion_previews/clips.json \
            --target assets/characters/agata/rt3d/agata_rt.glb --src-root _src --out out/rt > _rt.log 2>&1
          rc=$?
          grep -v "^$\|INFO\|Saved:" _rt.log | tee "out/log_${{ matrix.id }}.txt"
          exit $rc
      - name: Рендер (Cycles CPU) и H.264
        run: |
          set +e
          python tools/motion_previews/render_preview.py --clip "${{ matrix.id }}" --clips tools/motion_previews/clips.json \
            --target assets/characters/agata/rt3d/agata_rt.glb --rt out/rt --out out/pv \
            --font game/assets/fonts/pt_serif/PT_Serif-Web-Regular.ttf --font-bold game/assets/fonts/pt_serif/PT_Serif-Web-Bold.ttf > _rd.log 2>&1
          rc=$?
          grep -v "^$\|INFO\|Saved:\|Fra:\|render  *|\|^кадр [0-9]*/[0-9]*$" _rd.log | tail -60 | tee -a "out/log_${{ matrix.id }}.txt"
          grep -c "^кадр" _rd.log | sed 's/^/кадров отрендерено: /' | tee -a "out/log_${{ matrix.id }}.txt"
          ls -la out/pv
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pv-${{ matrix.id }}
          path: |
            out/rt/*.npz
            out/rt/*.json
            out/pv/*.mp4
            out/pv/*.json
            out/log_*.txt
          retention-days: 7

  collect:
    needs: [sources, render]
    if: always() && needs.sources.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-previews
          sparse-checkout: |
            tools/motion_previews
            previews
            retargeted
          filter: blob:none
      - uses: actions/download-artifact@v4
        with:
          pattern: pv-*
          path: _pv
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: log-sources
          path: _pv
      - name: Манифест, ролики, листы кадров
        run: |
          python3 -m pip install --quiet --timeout 60 pillow imageio-ffmpeg
          python3 tools/motion_previews/collect.py --clips tools/motion_previews/clips.json --in _pv --run "${{ github.run_id }}" --sha "${{ github.sha }}"
          ls -la previews previews/* retargeted | head -80
      - name: Коммит в motion-previews
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add -A previews retargeted
          git commit -q -m "motion-previews: ролики, манифест, ретаргет (run ${{ github.run_id }}) [skip ci]" || { echo "нечего коммитить"; exit 0; }
          for i in 1 2 3 4 5; do
            git fetch -q origin motion-previews && git rebase -q origin/motion-previews && git push -q origin HEAD:motion-previews && { echo "запушено"; exit 0; }
            sleep 10
          done
          exit 1
