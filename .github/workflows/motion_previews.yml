name: motion-previews

# Превью движений для выбора Директором (22.10): библиотеки Mesh2Motion / CMU / 100STYLE на модели Агаты.
# Живёт только в ветке motion-previews; в main не вливается. Результаты бот коммитит в эту же ветку:
#   previews/<библиотека>/<id>.mp4, previews/manifest.json, retargeted/<id>.npz, sources/… (probe).
# Запуск: изменить tools/motion_previews/** и запушить в motion-previews.

on:
  push:
    branches: [motion-previews]
    paths:
      - "tools/motion_previews/**"
      - ".github/workflows/motion_previews.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-previews
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-previews
          lfs: false
      - name: Режим
        id: mode
        run: echo "mode=$(python3 -c "import json;print(json.load(open('tools/motion_previews/request.json'))['mode'])")" >> "$GITHUB_OUTPUT"
      - name: 100STYLE (Zenodo) и страницы CMU
        if: steps.mode.outputs.mode == 'probe'
        run: |
          set -x
          mkdir -p sources/100style sources/cmu _dl
          curl -sSL --retry 3 "https://zenodo.org/api/records/8127870" -o sources/100style/zenodo_record.json || true
          python3 - <<'PY'
          import json
          d = json.load(open("sources/100style/zenodo_record.json"))
          print("license:", d.get("metadata", {}).get("license"))
          for f in d.get("files", []):
              print(f.get("key"), f.get("size"), f.get("checksum"), f.get("links", {}).get("self"))
          PY
          url=$(python3 -c "
          import json
          d=json.load(open('sources/100style/zenodo_record.json'))
          fs=[f for f in d.get('files',[]) if f.get('key','').lower()=='100style.zip']
          print(fs[0]['links']['self'] if fs else 'https://zenodo.org/records/8127870/files/100STYLE.zip?download=1')")
          curl -sSL --retry 3 "$url" -o _dl/100STYLE.zip
          ls -la _dl
          unzip -l _dl/100STYLE.zip > sources/100style/zip_listing.txt
          head -30 sources/100style/zip_listing.txt; tail -3 sources/100style/zip_listing.txt
          mkdir -p _x
          unzip -q -o _dl/100STYLE.zip '*.csv' '*.txt' '*.md' -d _x || true
          for s in $(python3 -c "import json;print(' '.join(json.load(open('tools/motion_previews/request.json'))['probe_styles']))"); do
            unzip -q -o _dl/100STYLE.zip "*/${s}_FW.bvh" "*/${s}_ID.bvh" "${s}_FW.bvh" "${s}_ID.bvh" -d _x || true
          done
          find _x -type f -printf '%p %s\n'
          find _x -type f \( -name '*.csv' -o -name '*.txt' -o -name '*.md' \) -exec cp {} sources/100style/ \;
          find _x -type f -name '*.bvh' -exec gzip -9 -k {} \; 
          find _x -type f -name '*.bvh.gz' -exec cp {} sources/100style/ \;
          # заголовок скелета одного BVH стиля для сверки имён костей
          f=$(find _x -name '*.bvh' | head -1); [ -n "$f" ] && sed -n '1,/^MOTION/p' "$f" > sources/100style/skeleton_header.txt
          for s in 113 144 111; do
            curl -sSL --retry 2 "http://mocap.cs.cmu.edu/search.php?subjectnumber=$s" -o "sources/cmu/subject_$s.html" || true
          done
          curl -sSL --retry 2 "http://mocap.cs.cmu.edu/faqs.php" -o sources/cmu/faqs.html || true
          curl -sSL --retry 2 "http://mocap.cs.cmu.edu/" -o sources/cmu/index.html || true
          ls -la sources/100style sources/cmu
      - name: Коммит
        if: always() && steps.mode.outputs.mode == 'probe'
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add -A sources
          git commit -q -m "motion-previews: probe 100STYLE/CMU (run ${{ github.run_id }}) [skip ci]" || { echo "нечего коммитить"; exit 0; }
          for i in 1 2 3 4 5; do
            git fetch -q origin motion-previews && git rebase -q origin/motion-previews && git push -q origin HEAD:motion-previews && exit 0
            sleep 10
          done
          exit 1
