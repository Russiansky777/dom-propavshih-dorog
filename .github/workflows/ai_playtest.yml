name: ai-playtest

# ИИ-плейтестер: Claude играет в веб-сборку (сайт GitHub Pages) настоящими щелчками — скриншот → модель
# выбирает действие → клик → снова скриншот. Режимы: acceptance (пункты Docs/ACCEPTANCE_*.md), fresh (новичок),
# gate (приёмка, затем свежий взгляд). Формат запроса — Docs/playtest/README.md.
#
# Запуск:
# 1) вручную — изменить или добавить pipeline/requests/playtest_<имя>.json и запушить (или workflow_dispatch);
# 2) ворота по передаче блока — САМИ, после каждой успешной сборки и публикации сайта (build-and-publish):
#    для каждого конфига pipeline/requests/playtest_gate_<m>.json берутся строки таблиц его Docs/ACCEPTANCE_<M>.md
#    в ОПУБЛИКОВАННОМ коммите и сравниваются с тем, что проверяли прошлые ворота (Docs/playtest/gates_state/).
#    Новые и изменённые пункты (критичные первыми) → приёмка, затем свежий взгляд; правка чеклиста, ещё не
#    попавшая на сайт, в опубликованном коммите отсутствует — ворота дождутся следующей успешной публикации.
#
# Ключ — секрет CLAUDE_API, рабочее пространство — CLAUDE_WORKSPACE (только в env). Лог публичный: в него не
# печатаются ни ключ, ни ID, ни ответы модели. Результат коммитится с [skip ci] в Docs/playtest/<дата>_<режим>_r<запуск>/.

on:
  push:
    branches: [main]
    paths:
      - "pipeline/requests/playtest_*.json"
  workflow_run:
    workflows: ["build-and-publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      request:
        description: "путь к запросу, напр. pipeline/requests/playtest_gate_m2.json"
        required: true
        default: "pipeline/requests/playtest_gate_m2.json"

permissions:
  contents: write
  actions: read

concurrency:
  # ворота по публикациям — по очереди (следующие читают обновлённое состояние); ручные запросы — параллельно
  group: ${{ github.event_name == 'workflow_run' && 'ai-playtest-gates' || format('ai-playtest-{0}', github.sha) }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.req.outputs.files }}
      gates: ${{ steps.req.outputs.gates }}
      sha: ${{ steps.req.outputs.sha }}
    steps:
      # инструменты и состояние — с main; чеклисты — из опубликованного коммита (--ref)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - name: Что запускать
        id: req
        env:
          REQ_INPUT: ${{ github.event.inputs.request }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          DEPLOYED: ${{ github.event.workflow_run.head_sha }}
        run: |
          sha=${DEPLOYED:-$(git rev-parse HEAD)}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          files=""; gates="[]"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$REQ_INPUT" in pipeline/requests/playtest_*.json) files="$REQ_INPUT" ;; *) echo "запрос должен быть pipeline/requests/playtest_*.json"; exit 1 ;; esac
          elif [ "$EVENT" = "push" ]; then
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              files=$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$sha" -- 'pipeline/requests/playtest_*.json' | tr '\n' ' ')
            else
              files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$sha" -- 'pipeline/requests/playtest_*.json' | tr '\n' ' ' || true)
            fi
          else
            # опубликованный коммит: чеклисты — из него; состояние прошлых ворот (строки и вердикты) — с main
            list=""
            for cfg in pipeline/requests/playtest_gate_*.json; do
              [ -f "$cfg" ] || continue
              doc=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).doc||"")' "$cfg")
              git cat-file -e "$sha:$doc" 2>/dev/null || { echo "$cfg: $doc ещё нет в опубликованной сборке"; continue; }
              items=$(node tools/ai_playtest/changed_items.mjs "$doc" --state Docs/playtest/gates_state --ref "$sha")
              [ -n "$items" ] || { echo "$doc: новых и изменённых пунктов нет"; continue; }
              echo "$doc: ворота по пунктам $items"
              list="$list{\"cfg\":\"$cfg\",\"doc\":\"$doc\",\"items\":\"$items\"},"
            done
            [ -n "$list" ] && gates="[${list%,}]"
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "запросы: ${files:-—}; ворота: $gates"

  requests:
    needs: plan
    if: needs.plan.outputs.files != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Playwright + Chromium
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Дождаться публикации сайта
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ai_playtest/wait_site.sh ""
      - name: Плейтест
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.CLAUDE_WORKSPACE }}
          REQ_FILES: ${{ needs.plan.outputs.files }}
        run: |
          status=0
          for f in $REQ_FILES; do
            mode=$(node -e 'try{console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).mode||"fresh")}catch(e){console.log("fresh")}' "$f")
            if [ "$mode" = "gate" ]; then modes="acceptance fresh"; else modes="$mode"; fi
            for m in $modes; do
              echo "=== $f ($m)"
              rm -f build/ai_playtest/*/summary.txt
              node tools/ai_playtest/playtest.mjs --request "$f" --mode "$m" || status=1
              tools/ai_playtest/commit_results.sh "${{ github.run_number }}" || status=1
            done
          done
          exit $status

  gates:
    needs: plan
    if: needs.plan.outputs.gates != '' && needs.plan.outputs.gates != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.gates) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Playwright + Chromium
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Чеклист — как на сайте
        env:
          DOC: ${{ matrix.gate.doc }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: git show "$SHA:$DOC" > "$DOC"   # плейтестер с main, пункты — из опубликованного коммита
      - name: Дождаться, пока сайт отдаёт опубликованный коммит
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ai_playtest/wait_site.sh "${{ needs.plan.outputs.sha }}"
      - name: Ворота
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.CLAUDE_WORKSPACE }}
          CFG: ${{ matrix.gate.cfg }}
          DOC: ${{ matrix.gate.doc }}
          ITEMS: ${{ matrix.gate.items }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          status=0
          echo "=== ворота $CFG: $DOC, пункты $ITEMS, сборка ${SHA:0:7}"
          rm -f build/ai_playtest/*/summary.txt
          node tools/ai_playtest/playtest.mjs --request "$CFG" --mode acceptance --items "$ITEMS" || status=1
          # строки чеклиста этой сборки проверены воротами; вердикты — из отчёта приёмки
          out=$(cat build/ai_playtest/last_out.txt 2>/dev/null || true)
          node tools/ai_playtest/changed_items.mjs "$DOC" --state Docs/playtest/gates_state --record "${SHA:0:7}" --ref "$SHA" ${out:+--verdicts "$out/log.json"}
          git checkout -- "$DOC" 2>/dev/null || true
          tools/ai_playtest/commit_results.sh "${{ github.run_number }}" || status=1
          git show "$SHA:$DOC" > "$DOC"
          rm -f build/ai_playtest/*/summary.txt
          node tools/ai_playtest/playtest.mjs --request "$CFG" --mode fresh || status=1
          git checkout -- "$DOC" 2>/dev/null || true
          tools/ai_playtest/commit_results.sh "${{ github.run_number }}" || status=1
          exit $status
