name: ai-sprite-qa

# ИИ-проверка спрайтов (зрение): листы 8 направлений каждого персонажа (assets/characters/<имя>/) — стопы, руки и
# сумка сквозь тело, текстура, направление, обрезка; линейка всех персонажей по росту — масштаб друг к другу.
# Запуск: после каждого прогона конвейера персонажей (pipeline-character; его коммит идёт с [skip ci], поэтому
# workflow_run) — проверяются только персонажи, чьи файлы спрайтов изменились (Docs/ai_checks/sprite_qa_state.json);
# ничего не изменилось — API не вызывается. Вручную: Docs/ai_checks/requests/sprite_qa.json ("chars": "all" или список).
# Отчёт: Docs/ai_checks/sprite_qa_<дата>.md + листы с находками. Правок в assets/ и game/ нет.

on:
  workflow_run:
    workflows: ["pipeline-character"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "Docs/ai_checks/requests/sprite_qa.json"
  workflow_dispatch:
    inputs:
      chars:
        description: "персонажи через запятую, all — все, пусто — только изменившиеся"
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-sprite-qa
  cancel-in-progress: false

jobs:
  qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Проверка спрайтов
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.CLAUDE_WORKSPACE }}
          CHARS_INPUT: ${{ github.event.inputs.chars }}
          EVENT: ${{ github.event_name }}
        run: |
          python -m pip install -q pillow
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null 2>&1 || true
          chars="$CHARS_INPUT"
          if [ "$EVENT" = "push" ]; then
            chars=$(node -e 'const r=JSON.parse(require("fs").readFileSync("Docs/ai_checks/requests/sprite_qa.json","utf8"));const c=r.chars;console.log(Array.isArray(c)?c.join(","):(c||""))')
          fi
          case "$chars" in
            all) node tools/ai_checks/sprite_qa.mjs --all ;;
            "") node tools/ai_checks/sprite_qa.mjs ;;
            *) node tools/ai_checks/sprite_qa.mjs --chars "$chars" ;;
          esac
      - name: Коммит отчёта
        if: always()
        run: |
          [ -d Docs/ai_checks ] || exit 0
          tools/ai_checks/commit.sh "ИИ-проверка спрайтов: $(cat build/ai_checks/summary.txt 2>/dev/null || echo отчёт) (run ${{ github.run_number }})" Docs/ai_checks
