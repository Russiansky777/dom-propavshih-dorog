name: pipeline-voice

# Озвучка реплик: ElevenLabs text-to-speech → ffmpeg (срез тишины, −17 LUFS, OGG Vorbis).
# Запуск: изменить pipeline/requests/voice_<набор>.json и запушить (поле "mode": list | generate | check),
# или вручную (workflow_dispatch). Секрет Eleven_API (имена секретов нечувствительны к регистру).
# Результат коммитится в assets/voice/ и pipeline/voice/ (voices.json, state/). Скрипт: pipeline/voice/eleven_voice.py.

on:
  push:
    paths:
      - "pipeline/requests/voice_*.json"
  workflow_dispatch:
    inputs:
      request:
        description: "путь к запросу, напр. pipeline/requests/voice_e0e1.json"
        required: true
        default: "pipeline/requests/voice_e0e1.json"

permissions:
  contents: write

concurrency:
  group: pipeline-voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Последний main, а не коммит запуска: прогоны идут друг за другом (concurrency), и следующий должен видеть
      # то, что закоммитил предыдущий (манифест, last_run.log) — иначе его коммит не ложится поверх (run 39945918080:
      # конфликт last_run.log, результаты пробы потеряны).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Определить запросы
        id: req
        run: |
          if [ -n "${{ github.event.inputs.request }}" ]; then
            echo "files=${{ github.event.inputs.request }}" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} -- 'pipeline/requests/voice_*.json' | tr '\n' ' ' || true)
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi
          echo "requests: $(cat $GITHUB_OUTPUT)"

      - name: ffmpeg
        if: steps.req.outputs.files != ''
        timeout-minutes: 6
        # 23.10 apt на раннерах висел 18 и 45+ минут (runs 39943689014, 39947069779) — ffmpeg из pip: imageio-ffmpeg,
        # статическая сборка (johnvansickle 7.0.2: libvorbis, libmp3lame, ebur128, alimiter, silenceremove); ffprobe в
        # ней нет — длительность скрипт берёт у ffmpeg. apt — только запасной путь, с тайм-аутом.
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if timeout 180 python -m pip install -q imageio-ffmpeg; then
              ff="$(python -c 'import imageio_ffmpeg as i; print(i.get_ffmpeg_exe())')"
              mkdir -p "$HOME/.local/ffbin" && ln -sf "$ff" "$HOME/.local/ffbin/ffmpeg"
              echo "$HOME/.local/ffbin" >> "$GITHUB_PATH"
              export PATH="$HOME/.local/ffbin:$PATH"
            fi
          fi
          if ! command -v ffmpeg >/dev/null; then
            echo "pip не дал ffmpeg — запасной путь apt (4 мин)"
            timeout 240 bash -c 'sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg' || true
          fi
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libvorbis && echo "libvorbis: есть"

      - name: ElevenLabs
        if: steps.req.outputs.files != ''
        timeout-minutes: 35
        env:
          ELEVEN_API: ${{ secrets.ELEVEN_API }}
        # Вывод (без ключа) копируется в pipeline/voice/state/last_run.log и коммитится: журналы Actions
        # из сессии Claude не читаются.
        run: |
          set -eo pipefail
          mkdir -p pipeline/voice/state
          log=pipeline/voice/state/last_run.log
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ) requests: ${{ steps.req.outputs.files }}" > "$log"
          python pipeline/voice/eleven_voice.py check 2>&1 | tee -a "$log"
          for f in ${{ steps.req.outputs.files }}; do
            echo "=== $f" | tee -a "$log"
            python pipeline/voice/eleven_voice.py run --request "$f" 2>&1 | tee -a "$log"
          done

      - name: Проверка манифеста
        if: always() && steps.req.outputs.files != ''
        run: |
          set -o pipefail
          python tools/validate_voice.py --strict --source-only 2>&1 | tee -a pipeline/voice/state/last_run.log

      - name: Копия в игру
        if: always() && steps.req.outputs.files != ''
        # assets/voice и game/assets/voice в одном коммите бота: прогон tools/run_tests.sh на любом коммите main не
        # переписывает копию игры (23.10: между коммитом бота и синхронизацией вручную — 27…94 файла расходились);
        # новый .import пишется целиком (uid, path) — импорт Godot его не меняет.
        run: bash tools/sync_voice.sh

      - name: Коммит результатов
        if: always() && steps.req.outputs.files != ''
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          # git add с несуществующим путём не добавляет ничего — добавляем только то, что есть
          for p in assets/voice game/assets/voice pipeline/voice; do if [ -e "$p" ]; then git add -A "$p"; fi; done
          if git diff --cached --quiet; then echo "нечего коммитить"; exit 0; fi
          git commit -q -m "pipeline: озвучка ElevenLabs (run ${{ github.run_id }}) [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            # журнал прогона — всегда наш (его пишет каждый прогон заново)
            if git rebase --autostash -X theirs origin/main; then
              if git push origin HEAD:main; then echo "запушено с попытки $i"; exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep 15
          done
          exit 1
