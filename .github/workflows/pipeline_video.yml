name: pipeline-video

# Оживление нарисованных кадров (image-to-video) через fal.ai: несколько моделей на один кадр — сравнить глазами
# (Директор 08.11, 22:06). Запуск: workflow_dispatch с путём к запросу pipeline/requests/video_<проба>.json.
# Секрет FAL_API. Результат коммитится в assets/incoming/video/<проба>/ (mp4 + report.json + last_run.log).
# Скрипт: tools/video_trial.py.

on:
  workflow_dispatch:
    inputs:
      request:
        description: "путь к запросу, напр. pipeline/requests/video_hug_1.json"
        required: true
        default: "pipeline/requests/video_hug_1.json"

permissions:
  contents: write

concurrency:
  group: pipeline-video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: fal-client
        run: python -m pip install -q fal-client

      - name: fal.ai
        timeout-minutes: 50
        env:
          FAL_KEY: ${{ secrets.FAL_API }}
        run: |
          set -eo pipefail
          req="${{ github.event.inputs.request }}"
          trial=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['trial'])" "$req")
          mkdir -p "assets/incoming/video/$trial"
          log="assets/incoming/video/$trial/last_run.log"
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ) request: $req" > "$log"
          python tools/video_trial.py --request "$req" 2>&1 | tee -a "$log"

      - name: Коммит результатов
        if: always()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          if [ -e assets/incoming/video ]; then git add -A assets/incoming/video; fi
          if git diff --cached --quiet; then echo "нечего коммитить"; exit 0; fi
          git commit -q -m "pipeline: image-to-video проба fal.ai (run ${{ github.run_id }}) [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            if git rebase --autostash -X theirs origin/main; then
              if git push origin HEAD:main; then echo "запушено с попытки $i"; exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep 15
          done
          exit 1
