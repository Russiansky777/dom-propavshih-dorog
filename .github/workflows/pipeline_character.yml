name: pipeline-character

# Запуск: положить/изменить pipeline/requests/<character>.json и запушить, либо вручную (workflow_dispatch).
# Нужен секрет репозитория MESHY_API_KEY. Результат коммитится обратно в assets/characters/<character>/.

on:
  push:
    paths:
      - "pipeline/requests/*.json"
  workflow_dispatch:
    inputs:
      request:
        description: "пути к файлам запросов через пробел, напр. pipeline/requests/agata.json"
        required: true
        default: "pipeline/requests/agata.json"
      from_run:
        description: "id прошлого прогона: взять его GLB и перерендерить без Meshy (0 кредитов)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  # своя группа на каждый коммит: прогоны разных пушей идут параллельно (коммит результатов — с rebase и повторами);
  # общая группа отменяла ожидающий прогон, когда любой пуш в pipeline/requests вставал в очередь (22.10: потерян прогон 39847958560)
  group: pipeline-character-${{ github.sha }}
  cancel-in-progress: false

jobs:
  character:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Определить запросы
        id: req
        run: |
          if [ -n "${{ github.event.inputs.request }}" ]; then
            echo "files=${{ github.event.inputs.request }}" >> "$GITHUB_OUTPUT"
          else
            # только запросы персонажей (icons_*/images_*/voice_*/rt3d_*/playtest_*/mirror_* — свои workflow); пусто — ничего не делаем
            files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'pipeline/requests/*.json' | grep -v '/icons_' | grep -v '/images_' | grep -v '/voice_' | grep -v '/rt3d_' | grep -v '/playtest_' | grep -v '/mirror_' | grep -v '/pending/' | tr '\n' ' ' || true)
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi
          echo "requests: $(cat $GITHUB_OUTPUT)"

      - name: Зависимости (bpy = Blender как модуль)
        if: steps.req.outputs.files != ''
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements.txt
          python -c "import bpy; print('bpy', bpy.app.version_string)"

      - name: GLB прошлых прогонов по запросам (поле from_run — без Meshy, 0 кредитов)
        if: steps.req.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for f in ${{ steps.req.outputs.files }}; do
            name=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['character'])" "$f")
            fr=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('from_run',''))" "$f")
            [ -n "$fr" ] || continue
            [ -d "_prev/$fr" ] || gh run download "$fr" -n "glb-$fr" -D "_prev/$fr" -R "${{ github.repository }}"
            src=$(find "_prev/$fr" -type d -path "*/out/$name" | head -1)
            [ -n "$src" ] || { echo "::error::в артефакте glb-$fr нет out/$name"; exit 1; }
            mkdir -p "pipeline/3d/out/$name"; cp -r "$src"/. "pipeline/3d/out/$name/"
            echo "$name: GLB из прогона $fr"; ls -la "pipeline/3d/out/$name"
          done

      - name: GLB из прошлого прогона (без Meshy)
        if: steps.req.outputs.files != '' && github.event.inputs.from_run != ''
        uses: actions/download-artifact@v4
        with:
          name: glb-${{ github.event.inputs.from_run }}
          path: _prev
          run-id: ${{ github.event.inputs.from_run }}
          github-token: ${{ github.token }}

      - name: Разложить GLB прошлого прогона
        if: steps.req.outputs.files != '' && github.event.inputs.from_run != ''
        run: |
          set -e
          mkdir -p pipeline/3d/out
          if [ -d _prev/out ]; then cp -r _prev/out/. pipeline/3d/out/; [ -d _prev/state ] && cp -r _prev/state/. pipeline/3d/state/ || true
          else cp -r _prev/. pipeline/3d/out/; fi
          find pipeline/3d/out -name '*.glb' | sed 's/^/  /'

      - name: Meshy — модель, риг, анимации
        if: steps.req.outputs.files != '' && github.event.inputs.from_run == ''
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          # журнал каждого персонажа коммитится даже при ошибке (логи Actions из сессии не читаются);
          # ошибка одного персонажа не останавливает остальных, но шаг в конце падает
          mkdir -p pipeline/3d/state; fail=0
          for f in ${{ steps.req.outputs.files }}; do
            echo "=== $f"
            n=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['character'])" "$f")
            fr=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('from_run',''))" "$f")
            if [ -n "$fr" ]; then echo "$n: from_run $fr — Meshy не вызывается"; continue; fi
            set -o pipefail
            if ! python pipeline/3d/meshy_character.py --request "$f" 2>&1 | tee "pipeline/3d/state/${n}_last_run.log"; then
              echo "::error::$n — ошибка Meshy, журнал pipeline/3d/state/${n}_last_run.log"; fail=1
            fi
          done
          exit $fail

      - name: Перенос клипов на риг персонажа (retarget_clips.py, 0 кредитов)
        if: steps.req.outputs.files != ''
        run: |
          # по умолчанию стойка — спокойная Idle_4 (библиотека pipeline/3d/motions), реплика начинается и кончается в ней;
          # "retarget" в запросе — свои роли, false — выключить
          set -e
          for f in ${{ steps.req.outputs.files }}; do
            name=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['character'])" "$f")
            glb="pipeline/3d/out/$name/animations.glb"
            [ -f "$glb" ] || continue
            python pipeline/3d/retarget_clips.py --glb "$glb" --request "$f" --out "$glb" \
              --clips-out "pipeline/3d/out/$name/clips.txt" --report "pipeline/3d/state/${name}_retarget.json"
          done

      - name: Рендер спрайтов (Blender/Cycles CPU)
        if: steps.req.outputs.files != ''
        run: |
          set -e
          for f in ${{ steps.req.outputs.files }}; do
            name=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['character'])" "$f")
            args=$(python -c "import json,sys;r=json.load(open(sys.argv[1]));print(' '.join(f'{a}={r.get(\"frames\",{}).get(a, 12 if a==\"walk\" else 8)}' for a in r.get('actions',['idle','walk'])))" "$f")
            elev=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('elev',14))" "$f")
            yaw=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('front_yaw',0))" "$f")
            clips=$(python -c "import json,sys,os;n=json.load(open(sys.argv[1]))['character'];p=f'pipeline/3d/state/{n}.json';st=json.load(open(p)) if os.path.exists(p) else {};print(' '.join(f'{k}={v[\"key\"]}' for k,v in st.get('actions',{}).items() if v.get('key')))" "$f")
            clips="$clips $(cat "pipeline/3d/out/$name/clips.txt" 2>/dev/null || true)"
            rsize=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('render_size',384))" "$f")
            rsamp=$(python -c "import json,sys;print(json.load(open(sys.argv[1])).get('render_samples',24))" "$f")
            win=$(python -c "import json,sys;r=json.load(open(sys.argv[1]));print(' '.join(f'{k}={v[0]}:{v[1]}' for k,v in r.get('clip_window',{}).items()))" "$f")
            fps=$(python -c "import json,sys;r=json.load(open(sys.argv[1]));print(' '.join(f'{k}={v}' for k,v in r.get('fps',{}).items()))" "$f")
            # стопы (pipeline/3d/feet_fix.py): у ходьбы и стойки — по умолчанию у всех; "feet_fix": false в запросе — выключить
            ff=$(python pipeline/3d/check_feet.py --glb "pipeline/3d/out/$name/animations.glb" --request "$f" --print-roles)
            python pipeline/render/render_sprites.py --glb "pipeline/3d/out/$name/animations.glb" --name "$name" \
              --out "assets/characters/$name" --directions 8 --frames $args --size "$rsize" --samples "$rsamp" --elev "$elev" --front-yaw "$yaw" ${clips:+--clips $clips} ${win:+--window $win} \
              ${ff:+--feet-fix $ff --feet-report "pipeline/3d/state/${name}_feet_fix.json"} ${fps:+--fps $fps}
            cp "pipeline/3d/out/$name/meshy_manifest.json" "assets/characters/$name/" 2>/dev/null || true
            cp "pipeline/3d/out/$name/views/"*.png "assets/characters/$name/" 2>/dev/null || true
          done

      - name: GLB для игры в 3D (поле rt3d в запросе)
        if: steps.req.outputs.files != ''
        run: |
          set -e
          for f in ${{ steps.req.outputs.files }}; do
            name=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['character'])" "$f")
            out=$(python -c "import json,sys;r=json.load(open(sys.argv[1])).get('rt3d') or {};print(r.get('out',''))" "$f")
            [ -n "$out" ] || continue
            tris=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['rt3d'].get('tris',60000))" "$f")
            # стопы у всех клипов ходьбы и стойки, потом упрощение сетки, текстуры 2K, матовая ткань
            python pipeline/3d/feet_fix.py --glb "pipeline/3d/out/$name/animations.glb" --auto \
              --out-glb "pipeline/3d/out/$name/rt3d_src.glb" --report "pipeline/3d/state/${name}_rt3d_feet.json"
            python pipeline/3d/build_rt3d_glb.py --base "pipeline/3d/out/$name/rt3d_src.glb" --tris "$tris" --max-tex 2048 --matte \
              --out "$out" --check-out "pipeline/3d/state/${name}_rt_check.json"
            rm -f "pipeline/3d/out/$name/rt3d_src.glb"
          done

      - name: Сохранить GLB как артефакт запуска
        if: steps.req.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: glb-${{ github.run_id }}
          path: |
            pipeline/3d/out/**/*.glb
            pipeline/3d/out/**/meshy_manifest.json
            pipeline/3d/state/*.json
          retention-days: 90

      - name: Стопы и лист — автопроверка (носок, подошва, скольжение, поза стойки, кадры и темп ходьбы)
        id: feet
        if: steps.req.outputs.files != ''
        run: |
          # числа — pipeline/3d/state/<name>_feet.json (коммитится шагом ниже); порог превышен — прогон красный
          bad=""
          for f in ${{ steps.req.outputs.files }}; do
            name=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['character'])" "$f")
            glb="pipeline/3d/out/$name/animations.glb"
            [ -f "$glb" ] || { echo "нет $glb — проверка стоп пропущена"; continue; }
            cl=$(cat "pipeline/3d/out/$name/clips.txt" 2>/dev/null || true)
            python pipeline/3d/check_feet.py --glb "$glb" --request "$f" --out "pipeline/3d/state/${name}_feet.json" ${cl:+--clips $cl} || bad="$bad $name"
            # лист: ходьба ≥ 20 кадров на цикл, темп листа = темп клипа (F16)
            [ -f "assets/characters/$name/sprites.json" ] && { python pipeline/render/check_sprites.py --sprites "assets/characters/$name/sprites.json" --request "$f" || bad="$bad $name(лист)"; }
          done
          if [ -n "$bad" ]; then echo "::error::стопы: порог превышен у:$bad (pipeline/3d/state/<name>_feet.json)"; echo "bad=$bad" >> "$GITHUB_OUTPUT"; fi

      - name: Коммит результатов
        if: always() && steps.req.outputs.files != ''
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add assets/characters pipeline/3d/state
          if git diff --cached --quiet; then echo "нечего коммитить"; exit 0; fi
          git commit -q -m "pipeline: спрайты персонажа из Meshy (run ${{ github.run_id }}) [skip ci]"
          git status --short | head -20
          # main мог уйти вперёд за время прогона — подтянуть и пушить с повторами
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            # конфликт по тем же листам (два прогона одного персонажа подряд) — побеждает этот, более новый прогон
            if git rebase -X theirs --autostash origin/main; then
              if git push origin HEAD:main; then echo "запушено с попытки $i"; exit 0; fi
            else
              echo "rebase не прошёл:"; git status; git rebase --abort || true
            fi
            sleep 15
          done
          echo "::error::не удалось запушить результаты — перезапуск: workflow_dispatch с from_run=${{ github.run_id }}"
          exit 1

      - name: Стопы — итог
        if: always() && steps.feet.outputs.bad != ''
        run: |
          echo "::error::стопы не прошли проверку:${{ steps.feet.outputs.bad }}"
          exit 1

      - name: Спрайты как артефакт, если коммит не прошёл
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sprites-${{ github.run_id }}
          path: assets/characters/**
          retention-days: 30
