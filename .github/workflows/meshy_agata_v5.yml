name: meshy-agata-v5

# Агата v5 — модели-кандидаты в Meshy на выбор Директору (31.10, «переделать Агату целиком… с вариантами»).
# Ничего не коммитит и в игру не идёт: GLB, превью (4 стороны) и текстуры — в релиз agata-v5-work.
# Запуск: gh workflow run meshy_agata_v5.yml -f variants=A,B,C,D [-f resume=A=<task_id>]
# Кредиты Meshy: ≈ 30–40 за вариант (задача создаётся один раз; resume — продолжить без новых кредитов).

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "варианты через запятую (A, B, C, D — см. tools/meshy_v5.py)"
        required: true
        default: "A,B,C,D"
      resume:
        description: "уже созданные задачи: A=<id>,B=<id> (без новых кредитов)"
        required: false
        default: ""
      mode:
        description: "generate — кандидаты; rig — риг кандидата (variants = одна буква): упрощение в Blender, вход рига в релиз, риг Meshy (5 кр.)"
        required: false
        default: "generate"

permissions:
  contents: write

concurrency:
  group: meshy-agata-v5
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Зависимости
        run: python -m pip install --quiet pillow numpy

      - name: Blender (bpy) — для рига
        if: github.event.inputs.mode == 'rig'
        run: python -m pip install --quiet bpy==5.2.2

      - name: Вход рига — упрощение кандидата и в релиз
        if: github.event.inputs.mode == 'rig'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          v="${{ github.event.inputs.variants }}"
          mkdir -p _v5
          gh release download agata-v5-work -p "agata_v5${v}.glb" -D _v5 --clobber
          python tools/v5_rig_input.py -- "_v5/agata_v5${v}.glb" "_v5/agata_v5${v}_rig_input.glb" 290000
          gh release upload agata-v5-work "_v5/agata_v5${v}_rig_input.glb" --clobber
          rm -f "_v5/agata_v5${v}.glb"

      - name: Meshy — риг
        if: github.event.inputs.mode == 'rig'
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: python tools/meshy_v5_rig.py --variant "${{ github.event.inputs.variants }}" --resume "${{ github.event.inputs.resume }}" --out _v5 2>&1 | tee -a _v5/run.log
        shell: bash

      - name: Meshy — кандидаты
        if: github.event.inputs.mode != 'rig'
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: mkdir -p _v5 && python tools/meshy_v5.py --variants "${{ github.event.inputs.variants }}" --resume "${{ github.event.inputs.resume }}" --out _v5 2>&1 | tee _v5/run.log
        shell: bash

      - name: В релиз agata-v5-work
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p _v5
          ls -la _v5 || true
          gh release view agata-v5-work >/dev/null 2>&1 || gh release create agata-v5-work --title "Агата v5 — кандидаты (рабочие файлы)" --notes "Модели-кандидаты Meshy на выбор Директору; не в игре. tools/meshy_v5.py" --prerelease
          shopt -s nullglob
          files=(_v5/*.glb _v5/*.png _v5/*.json _v5/*.txt _v5/*.log)
          [ ${#files[@]} -gt 0 ] && gh release upload agata-v5-work "${files[@]}" --clobber
          echo "загружено: ${#files[@]}"
