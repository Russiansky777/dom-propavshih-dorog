name: build-and-publish

# Каждый пуш в main, меняющий игру или данные: тесты → веб-сборка → GitHub Pages
# (постоянная ссылка, всегда текущая версия) → Windows-exe в релиз «latest».
# Одноразовая настройка Директором: Settings → Pages → Build and deployment → Source: «GitHub Actions».

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "data/**"
      - "tools/**"
      - ".github/workflows/build_and_publish.yml"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Без тестов (только сборка сайта и exe; тесты уже прошли у агента)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # не отменять идущую сборку: при пяти агентах пуши идут чаще, чем длится сборка, и с отменой сайт не обновлялся часами
  # (23.10: 39870479567, 39870873490, 39871635423 отменены подряд). Идущая доигрывает, из ожидающих GitHub оставляет самую свежую.
  group: build-and-publish
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_ZIP_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

jobs:
  build:
    runs-on: ubuntu-latest
    # 120: с жителями v2 (атласы ~1,2 ГБ) импорт и тесты дольше 40 минут — сборка 40231228355 оборвалась по времени на тестах.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-windows-linux-v1

      - name: Download Godot ${{ env.GODOT_VERSION }} (hashes from Docs/PROBE_M0.md)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSL --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_ZIP_SHA256}  godot.zip" | sha256sum -c -
          unzip -q -o godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          curl -sSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${TEMPLATES_SHA256}  templates.tpz" | sha256sum -c -
          unzip -q -o templates.tpz "templates/version.txt" "templates/web_*" "templates/windows_*" "templates/linux_*" -d tpz
          cp tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf godot.zip templates.tpz tpz

      # Pillow для tools/make_web_sheets.py (веб-копии листов жителей, I-T4b) — без него веб-экспорт падал на 4-й минуте.
      - name: Python + Pillow
        run: python3 -m pip install -q --break-system-packages pillow || python3 -m pip install -q pillow

      # Кэш импорта Godot (.godot/imported и др.): без него каждая сборка заново обрабатывает ~1,2 ГБ атласов жителей v2 (~40 мин).
      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ github.sha }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Tests (validators + headless Godot)
        if: ${{ !inputs.skip_tests }}
        env:
          GODOT: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64
        run: tools/run_tests.sh

      # Веб не должен мешать exe: при ошибке веба (размер, атласы) Windows всё равно собирается и публикуется.
      - name: Export web
        id: export_web
        continue-on-error: true
        env:
          GODOT: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64
        run: tools/export_web.sh

      - name: Export Windows
        env:
          GODOT: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64
        run: tools/export_windows.sh

      - name: Stamp build
        run: |
          echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)" > build/web/version.txt

      # Веб может не влезть в предел Pages (1 ГБ) — это не должно мешать exe ниже.
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: build/web

      # The site (deploy below) must not wait on the exe: a failed release upload (22.10: twice in a row, step
      # «Publish Windows exe», tests and exports green) left the site unpublished. The step stays visible — its
      # failure is an annotation with the command and its output (readable through the checks API without the
      # job log), and the job still succeeds so GitHub Pages gets the new build.
      - name: Publish Windows exe to rolling release «latest»
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          step() {
            local out
            if ! out=$("$@" 2>&1); then
              echo "::error title=Publish exe failed::$1 $2 $3 → $(printf '%s' "$out" | tr '\r\n' '  ' | cut -c1-900)"
              exit 1
            fi
            printf '%s\n' "$out"
          }
          notes="Текущая сборка main @ ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d\ %H:%M) UTC). Не подписана: SmartScreen → «Подробнее» → «Выполнить в любом случае». Веб-версия: https://russiansky777.github.io/dom-propavshih-dorog/"
          # Тег двигаем через API, а не git push: из неглубокого клона push тега падал HTTP 500 (с 24.10 exe не обновлялся).
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" >/dev/null 2>&1; then
            step gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          else
            step gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
          if gh release view latest >/dev/null 2>&1; then
            step gh release edit latest --title "Текущая сборка (main)" --notes "$notes" --target "$GITHUB_SHA"
          else
            step gh release create latest --title "Текущая сборка (main)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          ls -la build/windows/
          step gh release upload latest build/windows/DomPropavshihDorog.exe --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
