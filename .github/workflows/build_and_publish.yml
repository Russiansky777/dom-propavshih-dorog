name: build-and-publish

# Каждый пуш в main, меняющий игру или данные: тесты → веб-сборка → GitHub Pages
# (постоянная ссылка, всегда текущая версия) → Windows-exe в релиз «latest».
# Одноразовая настройка Директором: Settings → Pages → Build and deployment → Source: «GitHub Actions».

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "data/**"
      - "tools/**"
      - ".github/workflows/build_and_publish.yml"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Без тестов (только сборка сайта и exe; тесты уже прошли у агента)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # не отменять идущую сборку: при пяти агентах пуши идут чаще, чем длится сборка, и с отменой сайт не обновлялся часами
  # (23.10: 39870479567, 39870873490, 39871635423 отменены подряд). Идущая доигрывает, из ожидающих GitHub оставляет самую свежую.
  group: build-and-publish
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_ZIP_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

jobs:
  build:
    runs-on: ubuntu-latest
    # 120: с жителями v2 (атласы ~1,2 ГБ) импорт и тесты дольше 40 минут — сборка 40231228355 оборвалась по времени на тестах.
    timeout-minutes: 120
    # ревью 01.11 (В-10): the site goes out only when the smoke run of the built wasm passed (deploy below)
    outputs:
      site_ok: ${{ steps.smoke_web.outcome == 'success' }}
    steps:
      # 01.11 (прогон 41350615425): «No space left on device» сразу после checkout — рабочее дерево ~6,8 ГБ, а свободного
      # места на образе раннера бывает меньше. Убираем то, что сборке не нужно (dotnet, Android SDK, GHC, CodeQL): +20–30 ГБ.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / | tail -1
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-windows-linux-v1

      - name: Download Godot ${{ env.GODOT_VERSION }} (hashes from Docs/PROBE_M0.md)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -sSL --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_ZIP_SHA256}  godot.zip" | sha256sum -c -
          unzip -q -o godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          curl -sSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${TEMPLATES_SHA256}  templates.tpz" | sha256sum -c -
          unzip -q -o templates.tpz "templates/version.txt" "templates/web_*" "templates/windows_*" "templates/linux_*" -d tpz
          cp tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf godot.zip templates.tpz tpz

      # Pillow для tools/make_web_sheets.py (веб-копии листов жителей, I-T4b) — без него веб-экспорт падал на 4-й минуте.
      # setup-python: скрипты зовутся как `python3 -I` (изолированно) — такой Python не видит пакеты из ~/.local,
      # куда pip на раннере ставит без прав root; поэтому прежняя установка Pillow не помогала (веб падал за 0 с).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 12.11 (ревью): numpy, opencv и ffmpeg — для проверок tools/run_tests.sh, которые без них в CI молча не шли
      # (см. godot_check.yml); сборке сами не нужны, поэтому их отсутствие сборку не останавливает
      - name: Python + Pillow
        run: |
          python -m pip install -q pillow && python3 -I -c "import PIL; print('Pillow', PIL.__version__)"
          python -m pip install -q numpy opencv-python-headless || echo "::warning title=build::numpy/opencv не установились"
          sudo apt-get install -y -qq ffmpeg > /dev/null 2>&1 || echo "::warning title=build::ffmpeg не установился"

      # Кэш импорта Godot (.godot/imported и др.): без него каждая сборка заново обрабатывает ~1,2 ГБ атласов жителей v2 (~40 мин).
      - name: Cache Godot import
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('game/assets/**/*.import', 'game/assets/characters/**/sprites.json', 'game/export_presets.cfg') }}
          restore-keys: |
            godot-import-${{ env.GODOT_VERSION }}-

      - name: Tests (validators + headless Godot)
        if: ${{ !inputs.skip_tests }}
        env:
          GODOT: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64
        run: tools/run_tests.sh

      # Веб не должен мешать exe: при ошибке веба (размер, атласы) Windows всё равно собирается и публикуется.
      # K (31.10): the title shows which build this is (TitleScreen.build_stamp) — the commit and the time
      - name: Stamp game
        run: |
          printf '{"sha": "%s", "utc": "%s"}\n' "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" > game/build_info.json

      - name: Export web
        id: export_web
        continue-on-error: true
        env:
          GODOT: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64
        run: tools/export_web.sh

      # J (29.10): страница listen/ в режиме проверки играла старый дубль под новым текстом — проверка кликом в браузере
      # (Google Chrome раннера, без скачивания браузера Playwright). Не мешает публикации, но видна в итогах запуска.
      - name: Listen page check (review plays its own recording)
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          LISTEN_CHROME_CHANNEL: chrome
        run: |
          mkdir -p /tmp/pw && npm i --prefix /tmp/pw --no-save --silent playwright@1.48.2
          PLAYWRIGHT_FROM=/tmp/pw/x.js node tools/listen_review_web.mjs || { echo "::error title=listen/::▶ в режиме проверки играет не ту запись (tools/listen_review_web.mjs)"; exit 1; }

      # Ревью 01.11 (В-10): the built wasm is started in a browser before the site is published — title, «Новая игра»,
      # the first room, a few seconds of play, no console errors (tools/smoke_web.mjs). A failure keeps the old site
      # (deploy is skipped) and is an error annotation; the exe below goes out regardless.
      - name: Web smoke run (the built game starts in a browser)
        id: smoke_web
        if: steps.export_web.outcome == 'success'
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          SMOKE_CHROME_CHANNEL: chrome
        run: |
          mkdir -p /tmp/pw && npm i --prefix /tmp/pw --no-save --silent playwright@1.48.2
          PLAYWRIGHT_FROM=/tmp/pw/x.js node tools/smoke_web.mjs || { echo "::error title=web smoke::собранная веб-игра не прошла дымовой прогон (build/shots/smoke/report.json) — сайт не обновлён"; exit 1; }

      - name: Stamp build
        run: |
          echo "${GITHUB_SHA::7} $(date -u +%Y-%m-%dT%H:%MZ)" > build/web/version.txt

      # Веб может не влезть в предел Pages (1 ГБ) — это не должно мешать exe ниже.
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: build/web

      # Сайт уже выгружен выше: падение экспорта Windows (размер ПК-сборки с жителями v2) не мешает сайту.
      - name: Export Windows
        id: export_win
        continue-on-error: true
        env:
          GODOT: /home/runner/godot/Godot_v4.7.2-stable_linux.x86_64
          # 12.11: only the single exe. The «full» zip (exe + pck, 1.9 GB) differed by the size of the drawn sheets
          # alone, and the game draws live figures — the sheets are a fallback (DECISIONS 12.11). Back: WIN_FULL=1.
          WIN_FULL: "0"
        run: tools/export_windows.sh

      # The site (deploy below) must not wait on the exe: a failed release upload (22.10: twice in a row, step
      # «Publish Windows exe», tests and exports green) left the site unpublished. The step stays visible — its
      # failure is an annotation with the command and its output (readable through the checks API without the
      # job log), and the job still succeeds so GitHub Pages gets the new build.
      - name: Publish Windows exe to rolling release «latest»
        if: steps.export_win.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          step() {
            local out
            if ! out=$("$@" 2>&1); then
              echo "::error title=Publish exe failed::$1 $2 $3 → $(printf '%s' "$out" | tr '\r\n' '  ' | cut -c1-900)"
              exit 1
            fi
            printf '%s\n' "$out"
          }
          notes="Текущая сборка main @ ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d\ %H:%M) UTC). DomPropavshihDorog.exe — один файл, вся игра. Не подписана: SmartScreen → «Подробнее» → «Выполнить в любом случае». Веб-версия: https://russiansky777.github.io/dom-propavshih-dorog/"
          # Тег двигаем через API, а не git push: из неглубокого клона push тега падал HTTP 500 (с 24.10 exe не обновлялся).
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" >/dev/null 2>&1; then
            step gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
          else
            step gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA"
          fi
          if gh release view latest >/dev/null 2>&1; then
            step gh release edit latest --title "Текущая сборка (main)" --notes "$notes" --target "$GITHUB_SHA"
          else
            step gh release create latest --title "Текущая сборка (main)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          ls -la build/windows/
          step gh release upload latest build/windows/DomPropavshihDorog.exe --clobber
          # The zip is no longer built (WIN_FULL=0 above): an old one left in the release would be a build of another
          # day next to the new exe. If it is built again (WIN_FULL=1), it is uploaded as before.
          if [ -f build/windows/DomPropavshihDorog_win.zip ]; then
            step gh release upload latest build/windows/DomPropavshihDorog_win.zip --clobber
          elif gh release view latest --json assets --jq '.assets[].name' | grep -qx DomPropavshihDorog_win.zip; then
            step gh release delete-asset latest DomPropavshihDorog_win.zip --yes
          fi

  deploy:
    needs: build
    if: needs.build.outputs.site_ok == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
