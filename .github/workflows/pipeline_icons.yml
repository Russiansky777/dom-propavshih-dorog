name: pipeline-icons

# Иконки предметов: Meshy text-to-image (прозрачный PNG). Запуск: изменить pipeline/requests/icons_<набор>.json и запушить.
# Секрет MESHY_API_KEY. Результат коммитится в assets/icons/ и pipeline/2d/state/.

on:
  push:
    paths:
      - "pipeline/requests/icons_*.json"
  workflow_dispatch:
    inputs:
      request:
        description: "путь к запросу, напр. pipeline/requests/icons_e0e1.json"
        required: true
        default: "pipeline/requests/icons_e0e1.json"

permissions:
  contents: write

concurrency:
  group: pipeline-icons
  cancel-in-progress: false

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Определить запросы
        id: req
        run: |
          if [ -n "${{ github.event.inputs.request }}" ]; then
            echo "files=${{ github.event.inputs.request }}" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'pipeline/requests/icons_*.json' | tr '\n' ' ' || true)
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi
          echo "requests: $(cat $GITHUB_OUTPUT)"

      - name: Meshy text-to-image
        if: steps.req.outputs.files != ''
        env:
          MESHY_API_KEY: ${{ secrets.MESHY_API_KEY }}
        run: |
          set -e
          python -m pip install -q pillow
          for f in ${{ steps.req.outputs.files }}; do
            echo "=== $f"
            python pipeline/2d/meshy_icons.py --request "$f"
          done

      - name: Коммит результатов
        if: always() && steps.req.outputs.files != ''
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add assets/icons pipeline/2d/state
          if git diff --cached --quiet; then echo "нечего коммитить"; exit 0; fi
          git commit -q -m "pipeline: иконки предметов из Meshy (run ${{ github.run_id }}) [skip ci]"
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            if git rebase --autostash origin/main; then
              if git push origin HEAD:main; then echo "запушено с попытки $i"; exit 0; fi
            else
              git rebase --abort || true
            fi
            sleep 15
          done
          exit 1
