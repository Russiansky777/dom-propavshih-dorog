name: fetch-godotsteam
# Steam (Директор 16.11: «так надо чтобы и достижения и оверлей и сохранения»): достать готовую сборку GodotSteam
# GDExtension (MIT, https://store.godotengine.org/asset/godotsteam/godotsteam-gdextension/) — сессия Claude до
# codeberg.org не достаёт, раннер GitHub достаёт. В main не пишет: аддон (только win64 — игра, linux64 — проверки в
# CI и у агента) и SHA256.txt кладутся отдельной веткой `vendor-godotsteam`; Claude смотрит её, проверяет загрузку в
# Godot 4.7.2 и сам переносит в game/addons/godotsteam. Артефакты прогона сессии недоступны (хранилище закрыто).
# Только вручную; `tag` — выпуск (пусто — последний на Codeberg).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Выпуск GodotSteam (пусто — последний)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: List releases (Codeberg and the archived GitHub repo)
        run: |
          set -uo pipefail
          mkdir -p out
          curl -sSL --retry 3 "https://codeberg.org/api/v1/repos/godotsteam/godotsteam/releases?limit=15" -o out/codeberg_releases.json || true
          curl -sSL --retry 3 -H "Accept: application/vnd.github+json" "https://api.github.com/repos/GodotSteam/GodotSteam/releases?per_page=15" -o out/github_releases.json || true
          python3 - <<'EOF'
          import json
          for src in ("codeberg", "github"):
              try:
                  rel = json.load(open(f"out/{src}_releases.json"))
              except Exception as e:
                  print(src, "unreadable", e); continue
              if not isinstance(rel, list):
                  print(src, "not a list:", str(rel)[:300]); continue
              for r in rel:
                  names = [a.get("name") for a in r.get("assets", [])]
                  print(src, "|", r.get("tag_name"), "|", r.get("published_at") or r.get("created_at"), "|", ", ".join(names))
          EOF

      - name: Download the GDExtension archives
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          python3 - <<'EOF'
          import json, os, urllib.request, hashlib
          tag = os.environ.get("TAG", "").strip()
          picked = []
          for src in ("codeberg", "github"):
              try:
                  rel = json.load(open(f"out/{src}_releases.json"))
              except Exception:
                  continue
              if not isinstance(rel, list) or not rel:
                  continue
              # a GDExtension release is tagged `<v>-gde` beside the module one (`<v>`, editors and templates)
              cands = [r for r in rel if (not tag or r.get("tag_name") in (tag, tag + "-gde"))
                       and any("gdextension" in (a.get("name") or "").lower() for a in r.get("assets", []))]
              for r in cands[:1]:
                  for a in r.get("assets", []):
                      n = (a.get("name") or "")
                      if "gdextension" in n.lower():
                          picked.append((src, r.get("tag_name"), n, a.get("browser_download_url")))
              if picked:
                  break
          os.makedirs("out/dl", exist_ok=True)
          with open("out/SHA256.txt", "w") as sums:
              for src, t, n, url in picked:
                  dst = f"out/dl/{n}"
                  print("download", src, t, n, url)
                  urllib.request.urlretrieve(url, dst)
                  h = hashlib.sha256(open(dst, "rb").read()).hexdigest()
                  sums.write(f"{h}  {n}  {src} {t} {url}\n")
          print(open("out/SHA256.txt").read() or "nothing picked")
          EOF
          ls -la out/dl
          for z in out/dl/*.zip; do if [ -f "$z" ]; then unzip -l "$z" | tail -60; fi; done
          test -s out/SHA256.txt

      - uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: true

      - name: Push the addon to branch vendor-godotsteam
        run: |
          set -euo pipefail
          rm -rf x && mkdir x && unzip -q out/dl/*.zip -d x
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan vendor-godotsteam
          git rm -rq --cached . || true
          rm -rf ./* .github
          mkdir -p game/addons/godotsteam
          src=../x/addons/godotsteam
          cp $src/godotsteam.gdextension $src/license.md $src/readme.md game/addons/godotsteam/
          cp -r $src/win64 $src/linux64 game/addons/godotsteam/
          cp ../out/SHA256.txt ../out/codeberg_releases.json game/addons/godotsteam/ 2>/dev/null || true
          git add -A game
          git commit -q -m "GodotSteam GDExtension $(cut -d' ' -f5 ../out/SHA256.txt | head -1): win64 + linux64 [skip ci]"
          git push -f origin vendor-godotsteam
          git log --stat -1 | cat
